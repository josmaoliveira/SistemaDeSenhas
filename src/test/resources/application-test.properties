# Configuração usada só pelos testes automáticos (.\mvnw.cmd test).
# Usa um banco SEPARADO para não apagar os seus dados. Crie-o uma vez no pgAdmin:
#   CREATE DATABASE sistemadesenhas_test;
spring.datasource.url=${DB_URL_TESTE:jdbc:postgresql://localhost:5432/sistemadesenhas_test}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}

# Firebase "de mentira": os testes geram tokens próprios (veja TokensDeTeste)
firebase.project-id=projeto-teste
firebase.api-key=chave-teste
firebase.credenciais=
app.gm-emails=gm@teste.com
