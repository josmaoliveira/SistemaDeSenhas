<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Totem de Senhas</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f8; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }

        .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 500px; text-align: center; }

        h1 { color: #333; margin-bottom: 30px; }

        .section { margin-bottom: 30px; padding: 20px; border-radius: 10px; background: #fff; border: 1px solid #eee; }

        /* BOTÕES AGORA EM COLUNA */
        .grid-botoes {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            margin-top: 15px;
        }

        /* Estilo dos Botões Dinâmicos */
        .btn-opcao {
            padding: 15px 20px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            border: 2px solid #007bff;
            background: white;
            color: #007bff;
            border-radius: 10px;
            width: 250px;
            transition: 0.3s;
        }

        .btn-opcao:hover { background: #e7f1ff; }

        .btn-opcao.selecionado { background: #007bff; color: white; }

        .btn-voltar {
            margin-top: 25px;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            background: #dc3545;
            color: white;
            border-radius: 10px;
            width: 200px;
            transition: 0.3s;
        }

        .btn-voltar:hover {
            background: #b02a37;
            transform: scale(1.05);
        }

        #resultado {
            margin-top: 30px;
            padding: 20px;
            border: 3px dashed #28a745;
            border-radius: 15px;
            display: none;
            background: #f8fff9;
        }

        #senhaCodigo { font-size: 70px; color: #28a745; margin: 10px 0; font-weight: bold; }

        hr { border: 0; border-top: 1px solid #eee; margin: 20px 0; }

        @media print {
            @page {
                margin: 0;
            }

            body {
                margin: 1cm;
                background: white;
            }
            body * {
                visibility: hidden;
            }
            #resultado, #resultado * {
                visibility: visible;
            }

            #resultado {
                position: absolute;
                left: 0;
                top: 0;
                width: 95%;
                border: none !important;
                background: white !important;
                display: flex !important;
                flex-direction: column !important;
                align-items: center !important;
                justify-content: center !important;
                text-align: center !important;
            }
            #resultado button {
                display: none !important;
            }
            h1 {
                display: none !important;
            }
        }
    </style>
</head>
<body>

<div class="container" id="totem-interface">
    <h1 id="nome-empresa">Autoatendimento</h1>
    <div id="erro-empresa" style="display:none; color:#b91c1c; font-size:18px;"></div>

    <div class="section" id="secao-servicos">
        <h2>1. Selecione uma Opção</h2>
        <div id="container-servicos" class="grid-botoes">
        </div>
    </div>

    <div class="section" id="secao-prioridades" style="display: none;">
        <h2>2. Selecione a Prioridade</h2>
        <div id="container-prioridades" class="grid-botoes">
        </div>

        <button class="btn-voltar" onclick="voltarParaServicos()">← Voltar</button>
    </div>

    <div id="resultado" style="text-align: center;">
        <h2 style="margin-bottom: 5px;">Sua Senha:</h2>
        <div id="senhaCodigo" style="font-size: 80px; margin: 10px 0;"></div>
        <p id="detalhesSenha" style="font-size: 20px; font-weight: bold;"></p>
        <p style="margin-top: 10px;">Aguarde ser chamado no painel.</p>

        <button onclick="imprimirSenha()" class="btn-opcao" style="background-color: #28a745; color: white; border: none; margin-top: 20px; margin-bottom: 20px;">
            imprimir senha
        </button>
        <br>
        <button onclick="location.reload()" style="background: none; border: 1px solid #ccc; padding: 5px 10px; cursor: pointer;">
            Retirar outra senha
        </button>
    </div>
</div>

<script>
    // O link do totem diz de qual empresa ele é: /index.html?empresa=padaria-central
    const empresa = new URLSearchParams(location.search).get('empresa');
    const base = '/api/publico/' + encodeURIComponent(empresa || '');
    let servicoSelecionadoId = null;
    let idSenhaGerada = null;

    window.onload = async () => {
        if (!empresa) {
            mostrarErro('Link incompleto. Use o link do totem que aparece na tela de gestão da empresa. ' +
                'É funcionário? <a href="/login.html">Entrar</a>');
            return;
        }
        try {
            const dados = await buscar(base);
            document.getElementById('nome-empresa').innerText = dados.nomeFantasia;
            await carregarServicos();
        } catch (erro) {
            mostrarErro(erro.message);
        }
    };

    /** Chama a API pública e devolve o JSON (ou lança um erro com a mensagem do servidor). */
    async function buscar(url, opcoes) {
        const resp = await fetch(url, opcoes);
        const dados = await resp.json().catch(() => ({}));
        if (!resp.ok) throw new Error(dados.mensagem || 'Erro ao falar com o servidor.');
        return dados;
    }

    function mostrarErro(html) {
        document.getElementById('secao-servicos').style.display = 'none';
        const caixa = document.getElementById('erro-empresa');
        caixa.innerHTML = html;
        caixa.style.display = 'block';
    }

    /** Cria um botão com o texto informado (innerText evita HTML malicioso). */
    function criarBotao(texto, aoClicar) {
        const btn = document.createElement('button');
        btn.className = "btn-opcao";
        btn.innerText = texto;
        btn.onclick = aoClicar;
        return btn;
    }

    // 1. Busca os serviços da empresa
    async function carregarServicos() {
        const servicos = await buscar(base + '/servicos');
        const container = document.getElementById('container-servicos');
        container.innerHTML = "";
        if (servicos.length === 0) {
            container.innerText = "Nenhum serviço cadastrado ainda.";
        }
        servicos.forEach(s => {
            const btn = criarBotao(s.nome, () => selecionarServico(s.id, btn));
            container.appendChild(btn);
        });
    }

    // 2. Ao clicar no serviço: esconde serviços e mostra prioridades
    function selecionarServico(id, botao) {
        servicoSelecionadoId = id;
        document.querySelectorAll("#container-servicos .btn-opcao").forEach(b => b.classList.remove("selecionado"));
        botao.classList.add("selecionado");
        document.getElementById('secao-servicos').style.display = 'none';
        carregarPrioridades();
        document.getElementById('secao-prioridades').style.display = 'block';
    }

    // 3. Busca as prioridades da empresa
    async function carregarPrioridades() {
        const prioridades = await buscar(base + '/prioridades');
        const container = document.getElementById('container-prioridades');
        container.innerHTML = "";
        prioridades.forEach(p => container.appendChild(criarBotao(p.nome, () => gerarSenhaFinal(p.id))));
    }

    function voltarParaServicos() {
        servicoSelecionadoId = null;
        document.querySelectorAll("#container-servicos .btn-opcao").forEach(b => b.classList.remove("selecionado"));
        document.getElementById('secao-prioridades').style.display = 'none';
        document.getElementById('secao-servicos').style.display = 'block';
    }

    // 4. Gera a senha e mostra o resultado
    async function gerarSenhaFinal(prioridadeId) {
        try {
            const senha = await buscar(base + '/senhas', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ servicoId: servicoSelecionadoId, prioridadeId: prioridadeId })
            });
            idSenhaGerada = senha.id;
            exibirResultado(senha);
        } catch (erro) {
            alert(erro.message);
        }
    }

    function exibirResultado(senha) {
        document.querySelectorAll('.section').forEach(s => s.style.display = 'none');
        document.getElementById('resultado').style.display = 'block';
        document.getElementById('senhaCodigo').innerText = senha.codigo;
        document.getElementById('detalhesSenha').innerText = `Serviço: ${senha.servico}`;

        // Volta ao início depois de 10 segundos para o próximo cliente
        setTimeout(() => location.reload(), 10000);
    }

    async function imprimirSenha() {
        if (!idSenhaGerada) return;
        try {
            await buscar(`${base}/senhas/${idSenhaGerada}/imprimir`, { method: 'POST' });
            alert("Impressão enviada com sucesso!");
        } catch (erro) {
            alert(erro.message);
        }
    }
</script>

</body>
</html>
