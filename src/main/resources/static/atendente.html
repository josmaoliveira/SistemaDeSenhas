<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atendimento - Sistema de Senhas</title>
    <link rel="stylesheet" href="/css/estilo.css">
    <style>
        .grade { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
        .senha-atual { font-size: 64px; font-weight: 800; color: var(--azul-escuro); margin: 8px 0; }
        .historico-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--borda); }
        .historico-item strong { font-size: 20px; }
        @media (max-width: 800px) { .grade { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
<header class="topo">
    <h1 id="titulo-guiche">Atendimento</h1>
    <div class="usuario">
        <span>Olá, <strong id="nome"></strong></span>
        <button type="button" id="btn-sair" class="pequeno perigo">Sair</button>
    </div>
</header>

<main class="conteudo grade">
    <section class="cartao">
        <h2>Guichê</h2>
        <button type="button" id="btn-chamar" class="sucesso botao-largo" style="font-size:18px; padding:16px;">
            Chamar próxima senha
        </button>

        <div id="atendimento-atual" class="oculto" style="margin-top:20px;">
            <p class="texto-cinza">Atendimento em andamento</p>
            <div class="senha-atual" id="senha-atual"></div>
            <p id="detalhes"></p>
            <button type="button" id="btn-finalizar" class="perigo botao-largo">Finalizar atendimento</button>
        </div>

        <button type="button" id="btn-trocar" class="secundario botao-largo" style="margin-top:24px;">Trocar de guichê</button>
    </section>

    <section class="cartao">
        <h2>Últimas chamadas</h2>
        <div id="historico"><p class="texto-cinza">Nenhuma senha chamada ainda.</p></div>
    </section>
</main>

<script type="module">
    import { exigirLogin, api, sair, esc, avisar, irPara } from '/js/app.js';

    const $ = id => document.getElementById(id);
    const eu = await exigirLogin(['ATENDENTE', 'ADMIN_EMPRESA']);
    const guicheId = localStorage.getItem('guicheId');
    if (!guicheId) await irPara('/selecionar-guiche.html');

    let atendimentoAtual = null;
    $('nome').textContent = eu.nome;

    // ---------------------------------------------------------------- presença no guichê
    // Avisa o servidor a cada minuto que esta tela está aberta: o administrador vê o guichê como "ligado".
    const avisarPresenca = () => api(`/api/atendimentos/presenca/${guicheId}`, { metodo: 'POST' }).catch(() => {});
    const encerrarPresenca = () => api(`/api/atendimentos/presenca/${guicheId}`, { metodo: 'DELETE' }).catch(() => {});

    $('btn-sair').addEventListener('click', async () => {
        await encerrarPresenca();
        await sair();
    });

    /** Mostra (ou esconde) o atendimento em andamento. */
    function mostrarAtual(atendimento) {
        atendimentoAtual = atendimento;
        $('atendimento-atual').classList.toggle('oculto', !atendimento);
        if (!atendimento) return;
        $('senha-atual').textContent = atendimento.senha.codigo;
        const hora = new Date(atendimento.dataHoraInicio).toLocaleTimeString('pt-BR', { timeStyle: 'short' });
        $('detalhes').textContent = `${atendimento.senha.prioridade?.nome ?? ''} · chamada às ${hora}`;
    }

    /** Histórico vem do servidor: os últimos atendimentos deste guichê. */
    async function carregarHistorico() {
        const recentes = await api(`/api/atendimentos/recentes/${guicheId}`);
        $('historico').innerHTML = recentes.map(a => `
            <div class="historico-item">
                <strong>${esc(a.senha.codigo)}</strong>
                <button class="pequeno" data-rechamar="${a.id}">Rechamar</button>
            </div>`).join('') || '<p class="texto-cinza">Nenhuma senha chamada ainda.</p>';
    }

    $('btn-chamar').addEventListener('click', async () => {
        try {
            const atendimento = await api(`/api/atendimentos/chamar/${guicheId}`, { metodo: 'POST' });
            if (!atendimento) {
                mostrarAtual(null);
                avisar('Não há senhas aguardando.', 'erro');
            } else {
                mostrarAtual(atendimento);
            }
            await carregarHistorico();
        } catch (erro) {
            avisar(erro.message, 'erro');
        }
    });

    $('btn-finalizar').addEventListener('click', async () => {
        if (!atendimentoAtual) return;
        try {
            await api(`/api/atendimentos/finalizar/${atendimentoAtual.id}`, { metodo: 'PUT' });
            mostrarAtual(null);
            avisar('Atendimento finalizado.');
        } catch (erro) {
            avisar(erro.message, 'erro');
        }
    });

    $('historico').addEventListener('click', async e => {
        const id = e.target.dataset.rechamar;
        if (!id) return;
        try {
            mostrarAtual(await api(`/api/atendimentos/rechamar/${id}`, { metodo: 'POST' }));
            avisar('Senha rechamada.');
            await carregarHistorico();
        } catch (erro) {
            avisar(erro.message, 'erro');
        }
    });

    $('btn-trocar').addEventListener('click', () => {
        if (atendimentoAtual) {
            avisar('Finalize o atendimento atual antes de trocar de guichê.', 'erro');
            return;
        }
        encerrarPresenca().finally(() => {
            localStorage.removeItem('guicheId');
            window.location.href = '/selecionar-guiche.html';
        });
    });

    // Ao abrir: nome do guichê, atendimento em andamento (se houver) e histórico
    try {
        const guiches = await api('/api/empresa/guiches');
        const guiche = guiches.find(g => String(g.id) === guicheId);
        if (!guiche) {
            localStorage.removeItem('guicheId');
            await irPara('/selecionar-guiche.html');
        }
        $('titulo-guiche').textContent = `${guiche.nome} · ${guiche.servico.nome}`;
        await avisarPresenca();
        setInterval(avisarPresenca, 60000);
        mostrarAtual(await api(`/api/atendimentos/atual/${guicheId}`));
        await carregarHistorico();
    } catch (erro) {
        avisar(erro.message, 'erro');
    }
</script>
</body>
</html>
