<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Senhas</title>
    <style>
        body { font-family: Arial, Helvetica, sans-serif; background: #f4f6f9; margin: 0; }
        #layout { display: flex; min-height: 100vh; }

        /* ÁREA DOS CARDS ATIVOS */
        #painelCentral { flex: 1; text-align: center; padding: 20px; display: flex; flex-direction: column; }
        h1 { margin-top: 30px; font-size: 50px; color: #1a237e; }
        #containerAtivos { display: flex; flex-wrap: wrap; justify-content: center; gap: 30px; margin-top: 40px; padding: 20px; }

        .card-ativo {
            background: white; padding: 30px 40px; border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); min-width: 280px;
            border: 4px solid transparent; transition: 0.3s;
        }

        /* Destaque para a senha mais recente */
        .card-ativo.recente { border-color: #28a745; transform: scale(1.05); box-shadow: 0 8px 25px rgba(40, 167, 69, 0.3); }
        .piscar { animation: flash 1s iteration-count 3; }
        @keyframes flash { 50% { opacity: 0.5; background-color: #e8f5e9; } }

        .titulo { font-size: 24px; font-weight: bold; color: #777; text-transform: uppercase; }
        .senha { font-size: 80px; font-weight: bold; color: #1a237e; margin: 10px 0; }
        .guiche { font-size: 30px; font-weight: bold; color: #333; }

        /* HISTÓRICO LATERAL */
        #historicoLateral { width: 300px; background: white; border-left: 3px solid #e0e0e0; padding: 20px; }
        #historicoLateral h2 { text-align: center; color: #1a237e; border-bottom: 2px solid #f4f6f9; padding-bottom: 10px; }
        .item { font-size: 22px; margin: 10px 0; padding: 15px; background: #f5f5f5; border-radius: 8px; text-align: center; font-weight: bold; }

        @media (max-width:900px){
            #layout { flex-direction: column; }
            #historicoLateral { width: 100%; border-left: none; border-top: 3px solid #e0e0e0; }
        }
    </style>
</head>
<body>

<div id="layout">
    <div id="painelCentral">
        <h1 id="nome-empresa">Painel de Atendimento</h1>
        <div id="containerAtivos"></div>
    </div>

    <div id="historicoLateral">
        <h2>Chamadas Recentes</h2>
        <div id="lista"></div>
    </div>
</div>

<audio id="audioChamada" src="/audio/chamada.mp3" preload="auto"></audio>

<script>
    // O link do painel diz de qual empresa ele é: /painel.html?empresa=padaria-central
    const empresa = new URLSearchParams(location.search).get('empresa');
    const base = '/api/publico/' + encodeURIComponent(empresa || '');

    // Histórico guardado neste navegador, separado por empresa
    const chaveHistorico = 'historicoSenhas-' + empresa;
    const chaveUltima = 'ultimaSenha-' + empresa;
    let historico = JSON.parse(localStorage.getItem(chaveHistorico)) || [];
    let ultimaSenhaCodigo = localStorage.getItem(chaveUltima) || null;
    let loopSonoro = null;

    /** Cria um elemento com classe e texto (textContent evita HTML malicioso). */
    function elemento(classe, texto) {
        const div = document.createElement("div");
        div.className = classe;
        div.textContent = texto;
        return div;
    }

    async function atualizarPainel() {
        const containerAtivos = document.getElementById("containerAtivos");
        try {
            const resposta = await fetch(base + '/painel');
            const dados = await resposta.json();
            if (!resposta.ok) {
                containerAtivos.innerHTML = "";
                containerAtivos.appendChild(elemento("titulo", dados.mensagem || "Erro ao carregar o painel."));
                return;
            }

            // Itens já vêm do servidor com a chamada mais recente primeiro: { codigo, guiche, inicio }
            const atendimentos = dados;
            if (atendimentos.length === 0) {
                containerAtivos.innerHTML = "<h2 style='color:#888;'>Nenhuma senha sendo atendida.</h2>";
                return;
            }

            const maisRecente = atendimentos[0];
            // Chave = senha + horário: uma senha RECHAMADA também toca o som de novo
            const chaveChamada = maisRecente.codigo + '|' + maisRecente.inicio;
            if (chaveChamada !== ultimaSenhaCodigo) {
                executarAlertaReforcado();
                ultimaSenhaCodigo = chaveChamada;
                localStorage.setItem(chaveUltima, ultimaSenhaCodigo);

                const entrada = `${maisRecente.codigo} - ${maisRecente.guiche}`;
                historico = historico.filter(h => h !== entrada);
                historico.unshift(entrada);
                if (historico.length > 10) historico.pop();
                localStorage.setItem(chaveHistorico, JSON.stringify(historico));
                renderizarHistorico();
            }

            containerAtivos.innerHTML = "";
            atendimentos.forEach((atend, index) => {
                // Destaque e piscar só no card que acabou de ser chamado
                const destaque = (index === 0 && loopSonoro !== null) ? "recente piscar" : "";
                const card = elemento(`card-ativo ${destaque}`, "");
                card.appendChild(elemento("titulo", "Senha"));
                card.appendChild(elemento("senha", atend.codigo));
                card.appendChild(elemento("guiche", atend.guiche));
                containerAtivos.appendChild(card);
            });
        } catch (error) {
            console.error("Erro ao carregar painel:", error);
        }
    }

    /** Toca o som 3 vezes (de 10 em 10 segundos) quando uma senha nova é chamada. */
    function executarAlertaReforcado() {
        const som = document.getElementById("audioChamada");
        if (loopSonoro) clearInterval(loopSonoro);

        let execucoes = 0;
        const tocar = () => {
            som.currentTime = 0;
            som.play().catch(() => console.log("Clique na página uma vez para liberar o som"));
            execucoes++;
            if (execucoes >= 3) {
                clearInterval(loopSonoro);
                loopSonoro = null;
                atualizarPainel(); // tira o destaque
            }
        };
        tocar();
        loopSonoro = setInterval(tocar, 10000);
    }

    function renderizarHistorico() {
        const lista = document.getElementById("lista");
        lista.innerHTML = "";
        historico.forEach(s => lista.appendChild(elemento("item", s)));
    }

    async function iniciar() {
        if (!empresa) {
            document.getElementById("containerAtivos").innerHTML =
                "<h2 style='color:#b91c1c;'>Link incompleto. Use o link do painel que aparece na tela de gestão da empresa.</h2>";
            return;
        }
        try {
            const resp = await fetch(base);
            const dados = await resp.json();
            if (resp.ok) document.getElementById("nome-empresa").textContent = dados.nomeFantasia;
        } catch (e) { /* mantém o título padrão */ }

        renderizarHistorico();
        atualizarPainel();
        setInterval(atualizarPainel, 2000); // atualiza a cada 2 segundos
    }

    iniciar();
</script>
</body>
</html>
