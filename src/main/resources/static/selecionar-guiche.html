<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selecionar Guichê - Sistema de Senhas</title>
    <link rel="stylesheet" href="/css/estilo.css">
</head>
<body>
<div class="centralizado">
    <div class="cartao caixa-login" style="text-align:center;">
        <p class="texto-cinza" id="empresa"></p>
        <h2>Olá, <span id="nome"></span></h2>
        <p>Selecione o guichê que você vai operar agora:</p>
        <select id="guiche"><option value="">Carregando...</option></select>
        <button type="button" id="btn-iniciar" class="botao-largo">Iniciar atendimento</button>
        <a href="/admin.html" id="link-gestao" class="botao secundario botao-largo oculto">Voltar para a gestão</a>
        <button type="button" id="btn-sair" class="secundario botao-largo">Sair</button>
    </div>
</div>

<script type="module">
    import { exigirLogin, api, sair, esc, avisar } from '/js/app.js';

    const $ = id => document.getElementById(id);
    const eu = await exigirLogin(['ATENDENTE', 'ADMIN_EMPRESA']);

    $('nome').textContent = eu.nome;
    $('empresa').textContent = eu.empresa.nomeFantasia;
    if (eu.perfil === 'ADMIN_EMPRESA') $('link-gestao').classList.remove('oculto');
    $('btn-sair').addEventListener('click', sair);

    try {
        // Só aparecem os guichês da empresa de quem está logado (o servidor filtra)
        const guiches = await api('/api/empresa/guiches');
        $('guiche').innerHTML = guiches.length
            ? '<option value="">Selecione um guichê</option>' + guiches.map(g =>
                `<option value="${g.id}">${esc(g.nome)}${g.setor ? ' - ' + esc(g.setor) : ''} (${esc(g.servico?.nome)})</option>`).join('')
            : '<option value="">Nenhum guichê cadastrado</option>';
    } catch (erro) {
        avisar(erro.message, 'erro');
    }

    $('btn-iniciar').addEventListener('click', () => {
        const guicheId = $('guiche').value;
        if (!guicheId) {
            avisar('Selecione um guichê antes de continuar.', 'erro');
            return;
        }
        // Lembra o guichê escolhido neste navegador
        localStorage.setItem('guicheId', guicheId);
        window.location.href = '/atendente.html';
    });
</script>
</body>
</html>
