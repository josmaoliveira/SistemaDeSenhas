# =====================================================================
# Configurações do Sistema de Senhas
#
# Valores no formato ${NOME:padrao} vêm de VARIÁVEIS DE AMBIENTE do Windows.
# Se a variável não existir, usa o valor depois dos dois-pontos.
#
# Alternativa às variáveis: crie src/main/resources/application-local.properties
# (ele NÃO vai para o GitHub). Veja o modelo application-local.properties.exemplo
# =====================================================================
spring.application.name=SistemaDeSenhas
spring.profiles.active=local

# --- Banco de dados (PostgreSQL) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sistemadesenhas_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}

# --- Tabelas ---
# Quem cria as tabelas agora é o Flyway (arquivos em src/main/resources/db/migration).
# "validate": o Hibernate só CONFERE se as classes Java batem com as tabelas e avisa se não baterem.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=true
spring.jpa.show-sql=false

spring.flyway.enabled=true
# Banco que já tinha tabelas (criadas antes pelo Hibernate): marca a versão 1 como feita, sem apagar nada
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# --- Firebase (login) ---
# Pegue estes valores no Console do Firebase: Configurações do projeto > Seus apps > App da Web
# Não são segredos (aparecem no navegador), mas é melhor colocá-los no application-local.properties.
firebase.project-id=${FIREBASE_PROJECT_ID:}
firebase.api-key=${FIREBASE_API_KEY:}
firebase.auth-domain=${FIREBASE_AUTH_DOMAIN:}
firebase.app-id=${FIREBASE_APP_ID:}
# Login/validação por SMS. Deixe false até ativar "Telefone" no Firebase.
firebase.sms-habilitado=${FIREBASE_SMS_HABILITADO:false}
# (Opcional) Caminho do JSON da "conta de serviço" do Firebase. Com ele o GM consegue trocar senha,
# desativar e excluir contas direto no Firebase. Este arquivo É SEGREDO: nunca coloque no GitHub.
firebase.credenciais=${FIREBASE_CREDENCIAIS:}

# --- GM (administrador geral do sistema) ---
# E-mails que viram GM no primeiro login. Separe por vírgula.
app.gm-emails=${GM_EMAILS:}

# --- Licença ---
# Dias de uso grátis para empresas novas
app.licenca.dias-gratis=90
# Segredo usado para calcular o serial de cada CNPJ. TROQUE em produção
# (variável de ambiente SERIAL_SEGREDO). Se mudar, os seriais existentes deixam de conferir.
app.serial.segredo=${SERIAL_SEGREDO:troque-este-segredo-em-producao}
